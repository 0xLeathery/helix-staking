<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="spiralGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="40%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="spiralGrad2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="256" cy="256" r="256" fill="#18181b"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#27272a" stroke-width="2"/>

  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Fibonacci spiral arm 1 — expanding outward clockwise -->
    <path d="
      M 0,-20
      A 20,20 0 0,1 20,0
      A 40,40 0 0,1 -20,40
      A 70,70 0 0,1 -70,-30
      A 110,110 0 0,1 40,-110
      A 160,160 0 0,1 160,50
    " fill="none" stroke="url(#spiralGrad1)" stroke-width="22" stroke-linecap="round"/>

    <!-- Fibonacci spiral arm 2 — 180deg offset -->
    <path d="
      M 0,20
      A 20,20 0 0,1 -20,0
      A 40,40 0 0,1 20,-40
      A 70,70 0 0,1 70,30
      A 110,110 0 0,1 -40,110
      A 160,160 0 0,1 -160,-50
    " fill="none" stroke="url(#spiralGrad2)" stroke-width="22" stroke-linecap="round"/>

    <!-- Center pulse -->
    <circle cx="0" cy="0" r="10" fill="#6ee7b7" opacity="0.9"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#6ee7b7" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- "HELIX" text below mark -->
  <text x="256" y="480" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif"
        font-size="36" font-weight="700" letter-spacing="12" fill="#a7f3d0">
    HELIX
  </text>
</svg>
